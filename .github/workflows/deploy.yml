# Deploys the worker on every push to mail.dxnd.ai (main only tracks upstream).
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   required
#   POLICY_AUD, TEAM_DOMAIN                       Cloudflare Access values; pushed to the worker when set
# Repository variables (override wrangler.jsonc, so addresses stay out of the repo):
#   DOMAINS             comma-separated domains to receive mail for
#   CATCH_ALL_MAILBOX   mailbox for addresses without their own mailbox
name: Deploy

on:
  push:
    branches:
      - mail.dxnd.ai
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy to Production
    # A manual run from any other branch stops here.
    if: github.ref_name == 'mail.dxnd.ai'
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure R2 bucket exists
        run: npx wrangler r2 bucket info agentic-inbox || npx wrangler r2 bucket create agentic-inbox

      - name: Deploy worker
        env:
          DOMAINS: ${{ vars.DOMAINS }}
          CATCH_ALL_MAILBOX: ${{ vars.CATCH_ALL_MAILBOX }}
        run: |
          args=()
          if [ -n "$DOMAINS" ]; then args+=(--var "DOMAINS:$DOMAINS"); fi
          if [ -n "$CATCH_ALL_MAILBOX" ]; then args+=(--var "CATCH_ALL_MAILBOX:$CATCH_ALL_MAILBOX"); fi
          if [ -z "$DOMAINS" ]; then
            echo "::warning::Repository variable DOMAINS is not set; deploying with the value in wrangler.jsonc"
          fi
          npx wrangler deploy "${args[@]}"

      - name: Push Access secrets to the worker
        env:
          POLICY_AUD: ${{ secrets.POLICY_AUD }}
          TEAM_DOMAIN: ${{ secrets.TEAM_DOMAIN }}
        run: |
          if [ -z "$POLICY_AUD" ] || [ -z "$TEAM_DOMAIN" ]; then
            echo "::warning::POLICY_AUD / TEAM_DOMAIN secrets are not set. The worker refuses every request until Access is enabled and both are added."
            exit 0
          fi
          printf '%s' "$POLICY_AUD" | npx wrangler secret put POLICY_AUD --name agentic-inbox
          printf '%s' "$TEAM_DOMAIN" | npx wrangler secret put TEAM_DOMAIN --name agentic-inbox
          echo "::notice::Access secrets updated"

  # Write scope lives here, away from the job that runs npm with production secrets.
  tag:
    name: Tag Deploy
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write

    steps:
      - name: Tag successful deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prod-${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
